name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  api-management-frontend:
    name: API Management Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: api-management-frontend/package-lock.json

      - name: Install dependencies
        working-directory: api-management-frontend
        run: npm ci

      - name: Build frontend
        working-directory: api-management-frontend
        run: npm run build

  analytics-service:
    name: Analytics Service CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: analytics-service/pom.xml

      - name: Build and test
        working-directory: analytics-service
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload Analytics Service JAR
        uses: actions/upload-artifact@v4
        with:
          name: analytics-service-jar
          path: analytics-service/target/*.jar
          if-no-files-found: error
          retention-days: 7

  api-management-service:
    name: API Management Service CI
    runs-on: ubuntu-latest

    env:
      MYSQL_DB_URL: jdbc:mysql://localhost:3306/api_management_test
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: root

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: api_management_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: api-management-service/pom.xml

      - name: Build and test
        working-directory: api-management-service
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload API Management Service JAR
        uses: actions/upload-artifact@v4
        with:
          name: api-management-service-jar
          path: api-management-service/target/*.jar
          if-no-files-found: error
          retention-days: 7

  smart-gateway-service:
    name: Smart Gateway Service CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: smart-gateway-service/pom.xml

      - name: Build and test
        working-directory: smart-gateway-service
        run: |
          chmod +x ./mvnw
          ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload Smart Gateway Service JAR
        uses: actions/upload-artifact@v4
        with:
          name: smart-gateway-service-jar
          path: smart-gateway-service/target/*.jar
          if-no-files-found: error
          retention-days: 7
